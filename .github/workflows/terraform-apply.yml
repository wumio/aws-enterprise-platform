name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Apply ${{ matrix.name }}
    runs-on: ubuntu-latest

    environment: dev

    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: networking-dev
            directory: stacks/networking/dev
          - name: security-dev
            directory: stacks/security/dev
          - name: compute-dev
            directory: stacks/compute/dev
          - name: application-dev
            directory: stacks/application/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
         terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Terraform Init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend-config=backend-config.hcl

      - name: Terraform Plan
        working-directory: ${{ matrix.directory }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ matrix.directory }}
        run: terraform apply -auto-approve tfplan
